name: digital-business-card
services:
  db:
    image: postgres:17.9-bookworm
    environment:
      POSTGRES_USER: business_card
      POSTGRES_PASSWORD: local_dev_password
      POSTGRES_DB: business_card
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U business_card -d business_card']
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    build: .
    init: true
    environment:
      DATABASE_URL: postgresql://business_card:local_dev_password@db:5432/business_card?schema=public
      NODE_ENV: production
      PORT: 3000
      DEMO_SANDBOX: 'true'
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy
    stop_grace_period: 15s
  db-test:
    image: postgres:17.9-bookworm
    profiles: ['test']
    environment:
      POSTGRES_USER: business_card
      POSTGRES_PASSWORD: local_test_password
      POSTGRES_DB: business_card_test
    ports:
      - '127.0.0.1:5434:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U business_card -d business_card_test']
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
